[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genealogy-digital-archive"
version = "1.0.1"
description = "Production archival system, indexing engine, and validation pipeline."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Glenn D. Lehman", email = "glnn.lhmn@gmail.com" }
]
keywords = [
    "genealogy",
    "archival-systems",
    "indexing-engine",
    "data-pipelines",
    "schema-validation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Sociology :: Genealogy",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows"
]
dependencies = [
    "google-genai>=2.24.0",
    "jsonschema>=4.26.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "rapidfuzz>=3.0.0"
]

[project.urls]
Homepage = "https://github.com/glnnlhmn/genealogy-digital-archive"
Repository = "https://github.com/glnnlhmn/genealogy-digital-archive"
Documentation = "https://github.com/glnnlhmn/genealogy-digital-archive/tree/main/docs"
"Issue Tracker" = "https://github.com/glnnlhmn/genealogy-digital-archive/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.0.0"
]
docs = [
    "mkdocs-material>=9.7.7"
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --basetemp=gtemp/pytest_tmp --strict-markers"
norecursedirs = [
    ".git",
    ".venv",
    "gtemp",
    "backups",
    "import",
    "logs",
    "data",
    "schemas/archive"
]
markers = [
    "smoke: Fast sanity checks executed prior to commit (< 5s)",
    "regression: Boundary and defect tests verifying specific defensive rules",
    "burnin: Multi-item stress, deep graph traversal, and batch load tests",
    "integration: Multi-file pipeline mutations and tool runs",
    "unit: Isolated standalone unit tests with zero disk I/O",
    "integrity: Whole-archive schema, topology, and drift validation",
    "slow: Tests with execution duration exceeding 2s"
]

[tool.coverage.run]
branch = true
source = ["tools/ops"]
omit = [
    "tests/*",
    "gtemp/*"
]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "sys.exit"
]
[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
exclude = ["data*", "logs*", "backups*", "gtemp*", "import*", "schemas*", "reports*", "prompts*", "tests*"]
