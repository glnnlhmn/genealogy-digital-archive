# Name: pyproject.toml
# Path: tools/lib/gdadomain/pyproject.toml
# Version: 1.0.0+build.r1

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdadomain"
version = "1.0.0"
description = "Genealogy Digital Archive domain entity managers and business logic"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Glenn Lehman" }
]
dependencies = [
    "gdacore>=1.0.0",
    "gdaschema>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v --cov=gdadomain --cov-branch --cov-report=term-missing"
markers = [
    "unit: Isolated standalone component tests with zero disk I/O",
    "smoke: Fast sanity checks and smoke paths",
    "regression: Boundary and defect edge-case tests",
    "burnin: Multi-item stress tests and large batch operations",
    "integration: Multi-component tests involving filesystem and Safe Backups",
    "integrity: Whole-archive schema constraints and invariant checks",
    "slow: Tests with execution duration exceeding 2.0s",
]